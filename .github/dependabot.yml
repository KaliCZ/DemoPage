version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Repo root so Dependabot finds DemoPage.slnx.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"

  # Moves the Dockerfiles' pinned base-image digests when Microsoft rebuilds a tag in place.
  - package-ecosystem: docker
    directories:
      - /backend/src/Kalandra.Api
      - /backend/src/Kalandra.McpServer
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
