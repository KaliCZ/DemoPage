name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_backend_deploy:
        description: 'Skip the backend deploy (use to ship frontend when backend is broken)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


permissions:
  contents: read
  packages: write
  deployments: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: kalicz/demopage/api
  MCP_IMAGE_NAME: kalicz/demopage/mcp

jobs:
  e2e:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Local Supabase's keys are deterministic, so hardcode them instead of waiting on `supabase status` to build.
    env:
      SB_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SB_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

    steps:
      - uses: actions/checkout@v7

      # Supabase starts first, in the background, so its ~50s image pull overlaps the setup and builds below.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Exact pin — resolving "latest" is a GitHub API call that rate-limits on shared runners.
          version: 2.108.0

      - name: Start local Supabase in background
        run: supabase start --exclude realtime,imgproxy,edge-runtime,logflare,vector,supavisor &

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build backend
        run: dotnet build backend/src/Kalandra.Api -c Release

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SB_ANON_KEY }}
          PUBLIC_API_URL: "http://localhost:5000"
          # Blanks the DSN committed in frontend/.env so test runs send no Sentry traffic.
          PUBLIC_SENTRY_DSN: ""

      - name: Serve frontend
        run: npm run serve &
        working-directory: frontend

      - name: Wait for Supabase
        run: |
          echo "Waiting for Supabase to be ready..."
          until supabase status > /dev/null 2>&1; do
            echo "Still waiting..."
            sleep 3
          done
          echo "Supabase is ready."

      - name: Start backend
        run: |
          # Line-buffered into a file so a startup failure or hang shows in the logs step below.
          stdbuf -oL -eL dotnet run --project backend/src/Kalandra.Api -c Release --no-build --urls http://localhost:5000 > "$RUNNER_TEMP/api.log" 2>&1 &
        env:
          # The connection string comes from appsettings.json, which already targets local Supabase's Postgres.
          Supabase__ProjectUrl: "http://127.0.0.1:54321"
          Turnstile__SecretKey: "1x0000000000000000000000000000000AA"
          ASPNETCORE_ENVIRONMENT: Development

      - name: Wait for backend
        uses: KaliCZ/verify-deployment@57cf981c4f0d8c4096fcba5308521e85f204da11  # v1
        with:
          health-url: http://localhost:5000/health
          max-attempts: 30
          retry-interval: 2

      - name: Backend startup logs
        if: always()
        run: |
          echo "===== backend api.log ====="
          cat "$RUNNER_TEMP/api.log" 2>/dev/null || echo "(no api.log captured)"

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_OUTPUT
        working-directory: frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: frontend


      - name: Run E2E tests
        run: ./node_modules/.bin/playwright test --config playwright.e2e.config.ts
        working-directory: frontend
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SERVICE_ROLE_KEY }}

      - name: Upload Playwright traces
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  frontend-format:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Check formatting
        run: npm run format:check
        working-directory: frontend

  frontend-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Blanks the DSN committed in frontend/.env so test runs send no Sentry traffic.
          PUBLIC_SENTRY_DSN: ""

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_OUTPUT
        working-directory: frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: frontend


      - name: Run Playwright tests (pages only — e2e requires backend)
        run: ./node_modules/.bin/playwright test tests/pages.spec.ts
        working-directory: frontend

  backend-deploy:
    needs: [e2e, backend-test, frontend-format, frontend-test]
    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.e2e.result == 'success' &&
          needs.backend-test.result == 'success' &&
          needs.frontend-format.result == 'success' &&
          needs.frontend-test.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.skip_backend_deploy != true
        )
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/src/Kalandra.Api/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Quadlet unit files to VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0
        with:
          host: ${{ vars.OCI_HOST }}
          username: ${{ vars.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          # Staged, not installed: the deploy installs only its target slot so the live slot's pinned unit stays untouched.
          source: "infra/quadlet/*.container"
          target: "/home/${{ vars.OCI_USERNAME }}/demoPage/quadlet-staging/"
          strip_components: 2

      - name: Sync Caddy routing fragment to VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0
        with:
          host: ${{ vars.OCI_HOST }}
          username: ${{ vars.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "infra/quadlet/kalandra.caddy"
          target: "/home/${{ vars.OCI_USERNAME }}/demoPage/"
          strip_components: 2

      - name: Deploy to Oracle Cloud (blue-green)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          SUPABASE_PROJECT_URL: ${{ vars.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.BACKEND_SENTRY_DSN }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
          BLOG_AUTHOR_NOTIFICATION_EMAIL: ${{ vars.BLOG_AUTHOR_NOTIFICATION_EMAIL }}
          JOB_OFFERS_OWNER_NOTIFICATION_EMAIL: ${{ vars.JOB_OFFERS_OWNER_NOTIFICATION_EMAIL }}
          # Digest, not :latest, so a restart or reboot runs exactly the build this run verified.
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ vars.OCI_HOST }}
          username: ${{ vars.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: DB_CONNECTION_STRING,SUPABASE_PROJECT_URL,SUPABASE_SERVICE_ROLE_KEY,TURNSTILE_SECRET_KEY,SENTRY_DSN,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM_EMAIL,BLOG_AUTHOR_NOTIFICATION_EMAIL,JOB_OFFERS_OWNER_NOTIFICATION_EMAIL,IMAGE_REF,EXPECTED_SHA
          script: |
            set -euo pipefail
            MAX_ATTEMPTS=40
            UNIT_DIR="$HOME/.config/containers/systemd"
            APP_DIR="$HOME/demoPage"
            STAGING="$APP_DIR/quadlet-staging"
            SITE_CONF=/srv/caddy/sites/kalandra.caddy

            # ----- 0. Preconditions: shared infra must already exist -----
            command -v podman >/dev/null 2>&1 \
              || { echo "podman not installed — see docs/architecture/deployment.md (Oracle Cloud VM)"; exit 1; }
            podman ps --filter name=caddy --filter status=running --format '{{.Names}}' | grep -qx caddy \
              || { echo "Shared Caddy not running — see docs/architecture/deployment.md (Shared Caddy reverse proxy)"; exit 1; }
            [ -d /srv/caddy/sites ] \
              || { echo "/srv/caddy/sites missing — see docs/architecture/deployment.md (Shared Caddy reverse proxy)"; exit 1; }

            umask 077
            mkdir -p "$APP_DIR"

            # Shared by both slots' EnvironmentFile= and rewritten every deploy so rotated secrets propagate.
            cat > "$APP_DIR/kalandra-api.env" << EOF
            ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
            Supabase__ProjectUrl=${SUPABASE_PROJECT_URL}
            Supabase__ServiceKey=${SUPABASE_SERVICE_ROLE_KEY}
            Turnstile__SecretKey=${TURNSTILE_SECRET_KEY}
            Sentry__Dsn=${SENTRY_DSN}
            Email__Host=${SMTP_HOST}
            Email__Port=${SMTP_PORT}
            Email__Username=${SMTP_USERNAME}
            Email__Password=${SMTP_PASSWORD}
            Email__FromEmail=${SMTP_FROM_EMAIL}
            Email__FromName=kalandra.tech
            Blog__AuthorNotificationEmail=${BLOG_AUTHOR_NOTIFICATION_EMAIL}
            JobOffers__OwnerNotificationEmail=${JOB_OFFERS_OWNER_NOTIFICATION_EMAIL}
            EOF

            # ----- 1. Determine which slot is currently active -----
            if systemctl --user is-active --quiet kalandra-api-blue.service; then
              OLD=blue; NEW=green; NEW_PORT=8081
            elif systemctl --user is-active --quiet kalandra-api-green.service; then
              OLD=green; NEW=blue; NEW_PORT=8080
            else
              OLD=""; NEW=blue; NEW_PORT=8080
            fi
            echo "Active: ${OLD:-<none>} → Deploying: $NEW on port $NEW_PORT"

            # ----- 2. Install + pin ONLY the slot we're deploying to -----
            # The live slot's unit stays untouched so a reboot mid-deploy brings production back on its verified image.
            mkdir -p "$UNIT_DIR"
            cp "$STAGING/kalandra-api-${NEW}.container" "$UNIT_DIR/kalandra-api-${NEW}.container"
            sed -i "s|^Image=.*|Image=${IMAGE_REF}|" "$UNIT_DIR/kalandra-api-${NEW}.container"
            systemctl --user daemon-reload

            # ----- 3. Pull the digest-pinned image -----
            podman pull "$IMAGE_REF"

            # ----- 4. Start the new slot -----
            # Stop first — `start` on a unit still active from a prior deploy is a no-op and keeps the old container.
            systemctl --user stop "kalandra-api-${NEW}.service" || true
            systemctl --user start "kalandra-api-${NEW}.service"

            # ----- 5. Liveness-gate the new slot directly (bypassing Caddy) -----
            # /health/live, not /health: a shared DB/Supabase outage breaks both slots equally and mustn't block a good build.
            echo "Waiting for new slot on port $NEW_PORT (expecting commit $EXPECTED_SHA)..."
            ATTEMPTS=0
            until curl -sf "http://localhost:${NEW_PORT}/health/live" 2>/dev/null | grep -qF "$EXPECTED_SHA"; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
                echo "New slot failed to start. Container logs:"
                podman logs "kalandra-api-${NEW}" 2>&1 | tail -50 || true
                echo "systemd status:"
                systemctl --user status "kalandra-api-${NEW}.service" --no-pager || true
                echo "Rolling back..."
                systemctl --user stop "kalandra-api-${NEW}.service" || true
                exit 1
              fi
              echo "Attempt $ATTEMPTS/$MAX_ATTEMPTS — waiting 3s..."
              sleep 3
            done
            echo "New slot is live on port $NEW_PORT (running $EXPECTED_SHA)."

            # The gate is liveness-only, so a degraded /health is surfaced as a warning instead.
            SLOT_STATUS=$(curl -s "http://localhost:${NEW_PORT}/health" 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
            if [ "$SLOT_STATUS" != "Healthy" ]; then
              echo "::warning::New slot is live but /health reports '${SLOT_STATUS:-unknown}' — check its dependencies (DB, Supabase)."
            fi

            # ----- 6. Point our site at the new port (promotion) and reload -----
            # Only our own fragment is written; the reload just re-reads the shared root Caddyfile and its imports.
            sed "s/__PORT__/${NEW_PORT}/" "$APP_DIR/kalandra.caddy" > "$SITE_CONF"
            # SELinux relabel so the Caddy container can read it — the unit's :z only relabels at container start.
            command -v chcon >/dev/null 2>&1 && chcon -t container_file_t "$SITE_CONF" || true
            podman exec caddy caddy reload --config /etc/caddy/Caddyfile

            # ----- 7. Retire the old slot -----
            # Remove the unit file too — Quadlet units can't be disabled, so only its absence stops a reboot starting both slots.
            if [ -n "$OLD" ]; then
              systemctl --user stop "kalandra-api-${OLD}.service" || true
              rm -f "$UNIT_DIR/kalandra-api-${OLD}.container"
              systemctl --user daemon-reload
            fi

            # ----- 8. Prune only THIS app's old images -----
            # The box is shared, so filter on our ownership label (set in the Dockerfiles).
            podman image prune -af --filter "label=tech.kalandra.app=demopage"

            echo "Deployment complete — kalandra-api-${NEW} serving on port ${NEW_PORT}."

      - name: Verify public endpoint
        uses: KaliCZ/verify-deployment@57cf981c4f0d8c4096fcba5308521e85f204da11  # v1
        with:
          # Liveness, matching the deploy gate, so a dependency outage doesn't fail the verify.
          health-url: https://api.kalandra.tech/health/live
          max-attempts: 20
          retry-interval: 5
          expected-content: ${{ github.sha }}

  mcp-deploy:
    # After backend-deploy because the API owns the Marten schema; this host runs AutoCreate.None in production.
    needs: [backend-deploy]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.MCP_IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/src/Kalandra.McpServer/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Quadlet unit files to VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0
        with:
          host: ${{ vars.OCI_HOST }}
          username: ${{ vars.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "infra/quadlet/*.container"
          target: "/home/${{ vars.OCI_USERNAME }}/demoPage/quadlet-staging/"
          strip_components: 2

      - name: Sync Caddy routing fragment to VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0
        with:
          host: ${{ vars.OCI_HOST }}
          username: ${{ vars.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "infra/quadlet/kalandra-mcp.caddy"
          target: "/home/${{ vars.OCI_USERNAME }}/demoPage/"
          strip_components: 2

      - name: Deploy to Oracle Cloud (blue-green)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          SUPABASE_PROJECT_URL: ${{ vars.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.BACKEND_SENTRY_DSN }}
          BLOG_FEED_RSS_URL: https://www.kalandra.tech/rss.xml
          MCP_RESOURCE_URI: https://mcp.kalandra.tech
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.MCP_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ vars.OCI_HOST }}
          username: ${{ vars.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: DB_CONNECTION_STRING,SUPABASE_PROJECT_URL,SUPABASE_SERVICE_ROLE_KEY,SENTRY_DSN,BLOG_FEED_RSS_URL,MCP_RESOURCE_URI,IMAGE_REF,EXPECTED_SHA
          script: |
            set -euo pipefail
            MAX_ATTEMPTS=40
            UNIT_DIR="$HOME/.config/containers/systemd"
            APP_DIR="$HOME/demoPage"
            STAGING="$APP_DIR/quadlet-staging"
            SITE_CONF=/srv/caddy/sites/kalandra-mcp.caddy

            # ----- 0. Preconditions: shared infra must already exist -----
            command -v podman >/dev/null 2>&1 \
              || { echo "podman not installed — see docs/architecture/deployment.md (Oracle Cloud VM)"; exit 1; }
            podman ps --filter name=caddy --filter status=running --format '{{.Names}}' | grep -qx caddy \
              || { echo "Shared Caddy not running — see docs/architecture/deployment.md (Shared Caddy reverse proxy)"; exit 1; }
            [ -d /srv/caddy/sites ] \
              || { echo "/srv/caddy/sites missing — see docs/architecture/deployment.md (Shared Caddy reverse proxy)"; exit 1; }

            umask 077
            mkdir -p "$APP_DIR"

            # No SMTP config: this host only writes events, and the API's async daemon sends the emails.
            cat > "$APP_DIR/kalandra-mcp.env" << EOF
            ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
            Supabase__ProjectUrl=${SUPABASE_PROJECT_URL}
            Supabase__ServiceKey=${SUPABASE_SERVICE_ROLE_KEY}
            Sentry__Dsn=${SENTRY_DSN}
            BlogFeed__RssUrl=${BLOG_FEED_RSS_URL}
            Mcp__ResourceUri=${MCP_RESOURCE_URI}
            EOF

            # ----- 1. Determine which slot is currently active -----
            if systemctl --user is-active --quiet kalandra-mcp-blue.service; then
              OLD=blue; NEW=green; NEW_PORT=8083
            elif systemctl --user is-active --quiet kalandra-mcp-green.service; then
              OLD=green; NEW=blue; NEW_PORT=8082
            else
              OLD=""; NEW=blue; NEW_PORT=8082
            fi
            echo "Active: ${OLD:-<none>} → Deploying: $NEW on port $NEW_PORT"

            # ----- 2. Install + digest-pin ONLY the slot we're deploying to -----
            mkdir -p "$UNIT_DIR"
            cp "$STAGING/kalandra-mcp-${NEW}.container" "$UNIT_DIR/kalandra-mcp-${NEW}.container"
            sed -i "s|^Image=.*|Image=${IMAGE_REF}|" "$UNIT_DIR/kalandra-mcp-${NEW}.container"
            systemctl --user daemon-reload

            # ----- 3. Pull the digest-pinned image -----
            podman pull "$IMAGE_REF"

            # ----- 4. Start the new slot (stop first so a stale container can't linger) -----
            systemctl --user stop "kalandra-mcp-${NEW}.service" || true
            systemctl --user start "kalandra-mcp-${NEW}.service"

            # ----- 5. Liveness-gate the new slot directly (bypassing Caddy) -----
            echo "Waiting for new slot on port $NEW_PORT (expecting commit $EXPECTED_SHA)..."
            ATTEMPTS=0
            until curl -sf "http://localhost:${NEW_PORT}/health/live" 2>/dev/null | grep -qF "$EXPECTED_SHA"; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
                echo "New slot failed to start. Container logs:"
                podman logs "kalandra-mcp-${NEW}" 2>&1 | tail -50 || true
                echo "systemd status:"
                systemctl --user status "kalandra-mcp-${NEW}.service" --no-pager || true
                echo "Rolling back..."
                systemctl --user stop "kalandra-mcp-${NEW}.service" || true
                exit 1
              fi
              echo "Attempt $ATTEMPTS/$MAX_ATTEMPTS — waiting 3s..."
              sleep 3
            done
            echo "New slot is live on port $NEW_PORT (running $EXPECTED_SHA)."

            # ----- 6. Point mcp.kalandra.tech at the new port (promotion) and reload -----
            sed "s/__PORT__/${NEW_PORT}/" "$APP_DIR/kalandra-mcp.caddy" > "$SITE_CONF"
            command -v chcon >/dev/null 2>&1 && chcon -t container_file_t "$SITE_CONF" || true
            podman exec caddy caddy reload --config /etc/caddy/Caddyfile

            # ----- 7. Retire the old slot -----
            if [ -n "$OLD" ]; then
              systemctl --user stop "kalandra-mcp-${OLD}.service" || true
              rm -f "$UNIT_DIR/kalandra-mcp-${OLD}.container"
              systemctl --user daemon-reload
            fi

            # No prune here: backend-deploy's label-scoped prune already covers this host's images.
            echo "Deployment complete — kalandra-mcp-${NEW} serving on port ${NEW_PORT}."

      - name: Verify public endpoint
        uses: KaliCZ/verify-deployment@57cf981c4f0d8c4096fcba5308521e85f204da11  # v1
        with:
          health-url: https://mcp.kalandra.tech/health/live
          max-attempts: 20
          retry-interval: 5
          expected-content: ${{ github.sha }}

  frontend-deploy:
    needs: [e2e, backend-test, frontend-format, frontend-test, backend-deploy]
    if: |
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          needs.e2e.result == 'success' &&
          needs.backend-test.result == 'success' &&
          needs.frontend-format.result == 'success' &&
          needs.frontend-test.result == 'success' &&
          needs.backend-deploy.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_API_URL: https://api.kalandra.tech
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          # Without the token, astro.config.mjs silently skips the Sentry source-map upload.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_CI_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=kalandra-tech
